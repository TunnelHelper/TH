version: 2

project_name: th

before:
  hooks:
    - go mod tidy

builds:
  - id: th
    main: ./cmd/th
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - '7'
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/TunnelHelper/TH/internal/version.Version={{ .Env.TH_VERSION }}
        -X github.com/TunnelHelper/TH/internal/version.Commit={{ .ShortCommit }}
        -X github.com/TunnelHelper/TH/internal/version.Date={{ .Date }}
    binary: th
  - id: thd
    main: ./cmd/thd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - '7'
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/TunnelHelper/TH/internal/version.Version={{ .Env.TH_VERSION }}
        -X github.com/TunnelHelper/TH/internal/version.Commit={{ .ShortCommit }}
        -X github.com/TunnelHelper/TH/internal/version.Date={{ .Date }}
    binary: thd

archives:
  - ids:
      - th
      - thd
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- with .Arm }}v{{ . }}{{- end }}
    files:
      - README.md
      - LICENSE
      - docs/*
      - packaging/*

nfpms:
  - id: th-packages
    package_name: th
    file_name_template: "{{ .ConventionalFileName }}"
    ids:
      - th
      - thd
    vendor: TunnelHelper
    homepage: https://github.com/TunnelHelper/TH
    maintainer: sudogeeker <237268424+sudogeeker@users.noreply.github.com>
    description: |-
      Linux network tunnel management daemon and non-root client.
      Supports GRE, VXLAN, WireGuard, AmneziaWG, XFRM, IKEv2, and SRv6.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: net
    priority: optional
    release: 1
    dependencies:
      - systemd
    contents:
      - src: packaging/systemd/thd.service
        dst: /usr/lib/systemd/system/thd.service
        file_info:
          mode: 0644
      - src: packaging/sysusers.d/th.conf
        dst: /usr/lib/sysusers.d/th.conf
        file_info:
          mode: 0644
      - src: packaging/tmpfiles.d/th.conf
        dst: /usr/lib/tmpfiles.d/th.conf
        file_info:
          mode: 0644
      - src: packaging/thd.json
        dst: /etc/th/thd.json
        type: config|noreplace
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/th/LICENSE
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    rpm:
      summary: Linux network tunnel management daemon and client
      group: System Environment/Daemons
    deb:
      fields:
        Bugs: https://github.com/TunnelHelper/TH/issues

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
