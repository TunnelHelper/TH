name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Unit and race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Network namespace integration tests
        run: |
          go test -c -tags=integration -o /tmp/tunnel-helper-integration.test ./internal/backend/linux
          sudo /tmp/tunnel-helper-integration.test -test.v

      - name: Cross-build Linux targets
        run: make build-linux
