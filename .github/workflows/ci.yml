name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Unit and race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check packaging scripts
        run: |
          bash -n run.sh
          for script in packaging/scripts/*.sh; do sh -n "$script"; done

      - name: Network namespace integration tests
        run: |
          go test -c -tags=integration -o /tmp/th-integration.test ./internal/backend/linux
          sudo /tmp/th-integration.test -test.v

      - name: Build release archives and native packages
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
