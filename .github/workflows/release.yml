name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

env:
  GORELEASER_VERSION: v2.17.0
  GORELEASER_SHA256: dde10e2d5a13cef969c0eec00c74f359c0ac306d702b1bd291ad9337b4e54c1d

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Run GoReleaser
        run: |
          archive="$RUNNER_TEMP/goreleaser.tar.gz"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/goreleaser/goreleaser/releases/download/$GORELEASER_VERSION/goreleaser_Linux_x86_64.tar.gz"
          printf '%s  %s\n' "$GORELEASER_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" goreleaser
          "$RUNNER_TEMP/goreleaser" release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
